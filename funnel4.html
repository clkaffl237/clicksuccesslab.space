<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Funnel 4 — Variant of ClickSuccessLab</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>body{font-family:system-ui,Arial,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;line-height:1.5}.card{border:1px solid #ddd;border-radius:8px;padding:20px}label{display:block;margin:12px 0 6px}input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px}.btn{display:inline-block;margin-top:14px;padding:12px 16px;border:0;border-radius:6px;background:#111;color:#fff;cursor:pointer}.note{font-size:.9em;color:#555;margin-top:10px}.err{color:#b00020;margin-top:10px}</style>
</head>
<body>
  <h1>ClickSuccessLab — Version B (A/B Test)</h1>
  <div class="card">
    <form id="optin">
      <label>Name</label><input type="text" name="name" required>
      <label>Email</label><input type="email" name="email" required>

      <input type="hidden" name="funnel" value="F4_B_Variant">

      <input type="hidden" name="utm_source" id="utm_source">
      <input type="hidden" name="utm_medium" id="utm_medium">
      <input type="hidden" name="utm_campaign" id="utm_campaign">
      <input type="hidden" name="utm_term" id="utm_term">
      <input type="hidden" name="utm_content" id="utm_content">

      <button class="btn" type="submit">Get instant access</button>
      <div class="note">No spam. Unsubscribe anytime.</div>
      <div id="error" class="err" style="display:none;"></div>
    </form>
  </div>

  <script>
    (function(){const p=new URLSearchParams(location.search);["utm_source","utm_medium","utm_campaign","utm_term","utm_content"].forEach(k=>{const el=document.getElementById(k);if(el) el.value=p.get(k)||"";});})();
    const WEBHOOK="https://clkaffl237.app.n8n.cloud/webhook/clicksuccess-lead";
    const NEXT_URL="/offer.html";
    document.getElementById("optin").addEventListener("submit", async (e)=>{
      e.preventDefault();
      const fd=new FormData(e.target);
      try{const res=await fetch(WEBHOOK,{method:"POST",body:fd});if(!res.ok)throw new Error();window.location.href=NEXT_URL;}
      catch(err){const box=document.getElementById("error");box.textContent="Something went wrong. Please try again.";box.style.display="block";}
    });
  </script>
</body>
</html>
