<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>HotWave Force Funnel 1</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #111;
      color: #fff;
      text-align: center;
    }
    h1 {
      color: #ff4500;
    }
    form {
      max-width: 400px;
      margin: 20px auto;
      background: #222;
      padding: 20px;
      border-radius: 8px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 4px;
    }
    button {
      background: #ff4500;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      cursor: pointer;
      font-size: 16px;
      border-radius: 4px;
    }
    button:hover {
      background: #e63e00;
    }
  </style>
</head>
<body>
  <h1>🔥 Welcome to HotWave Force 🔥</h1>
  <p>Your exclusive Funnel 1 offer is ready. Fill out the form below to get instant access!</p>

  <form id="leadForm">
    <input type="text" name="name" placeholder="Your Name" required />
    <input type="email" name="email" placeholder="Your Email" required />
    <button type="submit">Get Instant Access</button>
  </form>

  <p><a href="/funnel2/">👉 Go to Funnel 2</a></p>

  <script>
    document.getElementById('leadForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const data = {
        name: this.name.value,
        email: this.email.value
      };
      try {
        const res = await fetch("https://clkaffi237.app.n8n.cloud/webhook/clicksuccess-leads", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
        if (res.ok) {
          alert("✅ Success! Check your email.");
          this.reset();
        } else {
          alert("⚠️ Error: Something went wrong.");
        }
      } catch (err) {
        alert("❌ Network error. Please try again.");
      }
    });
  </script>
</body>
</html>
