<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ClickSuccessLab – Funnel 1 (HotwaveForce)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    function redirectAfterSubmit(e){
      e.preventDefault();
      const f = e.target;
      fetch(f.action, { method:"POST", body:new FormData(f) })
        .then(()=>{ window.location.href = "/thanks.html"; })
        .catch(()=>{ alert("Something went wrong. Please try again."); });
    }
  </script>
  <style>
    body { background:#111; color:#fff; font-family:Arial, sans-serif; text-align:center; padding:40px; }
    .wrap { max-width:760px; margin:0 auto; }
    input, button { width:100%; font-size:16px; padding:12px; margin:6px 0; }
    button { background:#00b3ff; color:#fff; border:0; cursor:pointer; border-radius:6px; }
    button:hover { background:#0086c2; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Get Instant Access</h1>
    <form action="https://clkaffl237.app.n8n.cloud/webhook/clicksuccess-lead"
          method="POST"
          onsubmit="redirectAfterSubmit(event)">
      <input type="text" name="name"  placeholder="Your Name"  required />
      <input type="email" name="email" placeholder="Your Email" required />
      <button type="submit">Get Instant Access</button>
    </form>
  </div>
</body>
</html>
