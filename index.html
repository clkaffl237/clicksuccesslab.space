<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>clicksuccesslab – start here</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --bg:#0f1220; --text:#e9edf3; --muted:#aab3c5; --btn:#007bff; --btn2:#0dcaf0; --btnh:#0056b3; }
    html,body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    .wrap { max-width:880px; margin:0 auto; padding:64px 20px; text-align:center; }
    h1 { font-size:34px; margin:0 0 10px; }
    p  { font-size:18px; color:var(--muted); margin:0 0 30px; }
    .cta { display:inline-block; margin:10px; padding:14px 22px; border-radius:8px; text-decoration:none; color:#fff; font-weight:700; }
    .cta.f1 { background:var(--btn); }
    .cta.f1:hover { background:var(--btnh); }
    .cta.f2 { background:var(--btn2); }
    .fine { margin-top:40px; font-size:13px; color:var(--muted); }
  </style>
  <script>
    // OPTIONAL: add your n8n webhook URL here (leave blank to disable)
    // Example: const N8N_WEBHOOK = "https://YOUR-N8N-DOMAIN/webhook/landing";
    const N8N_WEBHOOK = "";

    function go(path, funnel){
      try {
        if (N8N_WEBHOOK) {
          const payload = JSON.stringify({ event: "landing_click", funnel, ts: Date.now() });
          // sendBeacon is non-blocking, won’t delay navigation
          navigator.sendBeacon(N8N_WEBHOOK, payload);
        }
      } catch(e) { /* no-op */ }
      window.location.href = path;
    }
  </script>
</head>
<body>
  <div class="wrap">
    <h1>Welcome to clicksuccesslab</h1>
    <p>Your hub for funnels, offers, and fast execution. Pick where you want to start.</p>

    <a class="cta f1" href="javascript:void(0)"
       onclick="go('/hotwaveforce/index.html','hotwaveforce')">Start Funnel 1 (hotwaveforce)</a>

    <a class="cta f2" href="javascript:void(0)"
       onclick="go('/clicksuccesslab/index.html','clicksuccesslab')">Start Funnel 2 (clicksuccesslab)</a>

    <div class="fine">All lowercase paths; ready for n8n tracking if you add your webhook.</div>
  </div>
</body>
</html>
