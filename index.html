<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ClickSuccessLab • start here</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="ClickSuccessLab root homepage. Start your journey with free affiliate funnels, guides, and quick links.">
  <style>
    :root{
      --bg:#0f1220; --edge:#edf5ff; --muted:#aab3c5;
      --btn1:#0064fa; --btn1h:#0056b3;
      --btn2:#00a0fc; --btn2h:#0086d4;
      --card:#161b2e;
      --txt:#ffffff;
      --link:#8cb4ff;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif}
    .wrap{max-width:880px;margin:0 auto;padding:64px 24px}
    h1{font-size:32px;margin:0 0 8px}
    p{color:var(--muted);margin:0 0 24px;font-size:16px}
    .card{background:var(--card);border:1px solid rgba(255,255,255,.08);
      border-radius:14px;padding:28px;margin-top:18px}
    .cta-row{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px}
    .btn{display:inline-block;padding:14px 22px;border-radius:9px;
      text-decoration:none;color:#fff;font-weight:600}
    .f1{background:var(--btn1)}
    .f1:hover{background:var(--btn1h)}
    .f2{background:var(--btn2)}
    .f2:hover{background:var(--btn2h)}
    .fine{margin-top:36px;font-size:13px;color:var(--muted)}
    a.link{color:var(--link)}
    footer{margin-top:44px;text-align:center;color:var(--muted);font-size:13px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Welcome to ClickSuccessLab 🚀</h1>
      <p>This is your starting point. Choose a funnel to begin.</p>

      <div class="cta-row">
        <a class="btn f1" href="/funnel1.html">Start Funnel 1</a>
        <a class="btn f2" href="/funnel2.html">Start Funnel 2</a>
      </div>

      <p class="fine">
        Need help? Open <a class="link" href="/about.html">about</a> or
        <a class="link" href="/thanks.html">thanks page</a>.
      </p>
    </div>

    <footer>© 2025 ClickSuccessLab. All rights reserved.</footer>
  </div>
</body>
</html>
